<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'">
    <meta name="color-scheme" content="light dark">
    <title>{{name}}</title>
    <link rel="icon" href="{{favicon}}">
    <link rel="stylesheet" href="/styles.css?v=13">
    <script src="/ui.js?v=4" defer></script>
    <script src="/app.js?v=12" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="{{name}} home">{{brand}}</a>
      <nav class="header-actions" aria-label="Account" {{account_hidden}}>
        <a id="help-link" class="secondary-button header-help" href="/help" {{account_hidden}}><span data-icon="help"></span><span>Help</span></a>
        <button id="logout-button" class="secondary-button header-logout" type="button" {{account_hidden}}><span data-icon="logout"></span><span>Sign out</span></button>
      </nav>
    </header>

    <main>
      <section class="panel" aria-labelledby="page-title">
        <h1 id="page-title">Website preview</h1>
        <p class="intro">Preview a website on another server.</p>

        <form id="preview-form" novalidate>
          <div class="field">
            <label for="hostname">URL or hostname</label>
            <input id="hostname" name="hostname" type="text" inputmode="url" autocomplete="url" placeholder="https://example.com/page" required>
          </div>



          <div class="field">
            <label for="ip">Server IP address</label>
            <input id="ip" name="ip" type="text" autocomplete="off" placeholder="203.0.113.20" required maxlength="45">
          </div>

          <details class="advanced">
            <summary>Advanced</summary>
            <div class="advanced-fields">
              <div class="field">
                <label for="expires-at">Expires</label>
                <input id="expires-at" name="expiresAt" type="datetime-local" required>
              </div>
              <div class="field">
                <label for="preview-password">Preview password <span class="optional">(optional)</span></label>
                <input id="preview-password" name="password" type="password" autocomplete="new-password" maxlength="72">
              </div>
            </div>
          </details>

          <button id="submit-button" type="submit">
            <span class="button-label">Create preview</span>
            <span class="spinner" aria-hidden="true"></span>
            <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M4 10h11M10 5l5 5-5 5"/></svg>
          </button>
        </form>

        <p class="message" id="message" role="status" aria-live="polite" hidden></p>

        <section class="result" id="result" aria-labelledby="result-title" hidden>
          <div class="result-heading">
            <h2 id="result-title">Preview ready</h2>
            <span class="status-dot" aria-hidden="true"></span>
          </div>
          <div class="result-link-row">
            <a id="preview-link" href="#" target="_blank" rel="noopener noreferrer"></a>
            <button class="copy-button" id="copy-button" type="button">Copy link</button>
          </div>
          <p class="expiry" id="expiry"></p>
        </section>
        <p class="manage-link"><a href="/manage">Manage previews</a></p>
      </section>
    </main>
  </body>
</html>
